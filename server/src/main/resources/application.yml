server:
  port: 8080

aia:
  llm:
    # 选一个供应商，base-url 留空时自动取预设；填了 base-url 则以它为准
    # 内置: deepseek / dashscope / siliconflow / openai / ollama
    provider: deepseek
    # OpenAI 兼容接口的 baseUrl（含 /v1 前缀），末尾自动拼 /chat/completions
    base-url: ""
    api-key: ""
  config:
    # memory: 配置存在内存，重启即丢（默认，适合调试）
    # jdbc:   配置落数据库，重启不丢（需填下面的 datasource）
    mode: memory
    datasource:
      url: jdbc:mysql://192.168.5.15:3306/ai_agent?useUnicode=true&characterEncoding=utf8&serverTimezone=Asia/Shanghai
      username: ""
      password: ""
      driver-class-name: com.mysql.cj.jdbc.Driver
      maximum-pool-size: 5
  rag:
    # 为 true 时才装配知识库（未配置向量化服务时保持 false，框架其余功能照常可用）
    enabled: false
    embedding:
      # 选一个供应商即可，base-url / model / dimension 留空时自动取该供应商预设
      # 内置: deepseek(无向量化) / dashscope / siliconflow / openai / ollama
      provider: siliconflow
      # 以下留空 = 用供应商预设；填了则覆盖
      base-url: ""
      api-key: ""
      model: ""
      dimension: 0
    # 向量库实现: memory（默认，重启丢失）/ es / redis（Redis 8+ 的 Vector Set，无需 Redis Stack）
    store: memory
    es:
      url: ""
      index: aia-kb
    redis:
      host: ""
      port: 6379
      password: ""
      key: aia-kb
    rerank:
      # 开启后先放大粗召回再重排，准确率更高但每次检索多一次模型调用
      enabled: false
      # 留空 = 沿用 embedding 的供应商、base-url 和 api-key
      provider: ""
      base-url: ""
      api-key: ""
      model: ""
    chunk-size: 500
    chunk-overlap: 50
    top-k: 5
  # 多轮会话：会话存储 + 答案缓存 + 检索路由 + 上下文压缩
  session:
    enabled: true
    # memory / redis / jdbc / composite（Redis 热存储 + 数据库归档双写）
    store: memory
    ttl-seconds: 604800
    redis:
      host: ""
      port: 6379
      password: ""
      key-prefix: "aia:session:"
  answer-cache:
    # 开启后同一 agent 下归一化相同的问题直接返回缓存答案
    enabled: true
    store: memory
    capacity: 2000
    ttl-seconds: 3600
    redis:
      host: ""
      port: 6379
      password: ""
      key-prefix: "aia:answer:"
  router:
    # 寒暄/空输入不走知识库；canned=固定话术，model=交给模型（不挂知识库工具）
    enabled: true
    chitchat-mode: canned
    chitchat-reply: 您好，我是法律咨询助手，请问有什么可以帮您？
    extra-chitchat: 谢谢,再见,好的
  compression:
    # summarize / model-select / truncate
    enabled: true
    strategy: summarize
    threshold-tokens: 3000
    keep-recent-messages: 8
    model: deepseek-chat
