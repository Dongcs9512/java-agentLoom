server:
  port: 8080

aia:
  llm:
    # 选一个供应商，base-url 留空时自动取预设；填了 base-url 则以它为准
    # 内置: deepseek / dashscope / siliconflow / openai / ollama
    provider: deepseek
    # OpenAI 兼容接口的 baseUrl（含 /v1 前缀），末尾自动拼 /chat/completions
    base-url: ""
    api-key: ""
  config:
    # memory: 配置存在内存，重启即丢（默认，适合调试）
    # jdbc:   配置落数据库，重启不丢（需填下面的 datasource）
    mode: memory
    datasource:
      url: jdbc:mysql://192.168.5.15:3306/ai_agent?useUnicode=true&characterEncoding=utf8&serverTimezone=Asia/Shanghai
      username: ""
      password: ""
      driver-class-name: com.mysql.cj.jdbc.Driver
      maximum-pool-size: 5
  rag:
    # 为 true 时才装配知识库（未配置向量化服务时保持 false，框架其余功能照常可用）
    enabled: false
    embedding:
      # 选一个供应商即可，base-url / model / dimension 留空时自动取该供应商预设
      # 内置: deepseek(无向量化) / dashscope / siliconflow / openai / ollama
      provider: siliconflow
      # 以下留空 = 用供应商预设；填了则覆盖
      base-url: ""
      api-key: ""
      model: ""
      dimension: 0
    es:
      # 留空则用内存实现（重启丢失，仅适合调试）
      url: ""
      index: aia-kb
    rerank:
      # 开启后先放大粗召回再重排，准确率更高但每次检索多一次模型调用
      enabled: false
      # 留空 = 沿用 embedding 的供应商、base-url 和 api-key
      provider: ""
      base-url: ""
      api-key: ""
      model: ""
    chunk-size: 500
    chunk-overlap: 50
    top-k: 5
