server:
  port: 8080
  # 优雅下线：收到 SIGTERM 后先停止接收新请求，等在途请求跑完再退出
  shutdown: graceful

spring:
  lifecycle:
    timeout-per-shutdown-phase: 30s

management:
  endpoints:
    web:
      exposure:
        # 暴露 Prometheus 抓取端点与健康检查
        include: health,info,prometheus,metrics
  endpoint:
    health:
      show-details: when-authorized
  metrics:
    tags:
      application: agentloom
    distribution:
      percentiles-histogram:
        agentloom.agent.chat: true
        agentloom.rag.search: true

agentloom:
  # 全局共享 HttpClient：避免每次模型调用都重建连接池
  http:
    connect-timeout-ms: 5000
  # 并发防护：饱和时快速失败，避免线程/连接被打满
  concurrency:
    max-concurrent: 32
    max-wait-ms: 2000
    # >0 时启用每秒请求数限流
    rate-limit-per-second: 0
  llm:
    # 选一个供应商，base-url 留空时自动取预设；填了 base-url 则以它为准
    # 内置: deepseek / dashscope / siliconflow / openai / ollama
    provider: deepseek
    # OpenAI 兼容接口的 baseUrl（含 /v1 前缀），末尾自动拼 /chat/completions
    base-url: ""
    api-key: ""
  config:
    # memory: 配置存在内存，重启即丢（默认，适合调试）
    # jdbc:   配置落数据库，重启不丢（需填下面的 datasource）
    mode: memory
    datasource:
      url: jdbc:mysql://localhost:3306/ai_agent?useUnicode=true&characterEncoding=utf8&serverTimezone=Asia/Shanghai
      username: ""
      password: ""
      driver-class-name: com.mysql.cj.jdbc.Driver
      maximum-pool-size: 5
  rag:
    # 为 true 时才装配知识库（未配置向量化服务时保持 false，框架其余功能照常可用）
    enabled: false
    embedding:
      # 选一个供应商即可，base-url / model / dimension 留空时自动取该供应商预设
      # 内置: deepseek(无向量化) / dashscope / siliconflow / openai / ollama
      provider: siliconflow
      # 以下留空 = 用供应商预设；填了则覆盖
      base-url: ""
      api-key: ""
      model: ""
      dimension: 0
    # 向量库实现: memory（默认，重启丢失）/ es / redis（Redis 8+ 的 Vector Set，无需 Redis Stack）
    store: memory
    es:
      url: ""
      index: aia-kb
    redis:
      host: ""
      port: 6379
      password: ""
      key: aia-kb
    rerank:
      # 开启后先放大粗召回再重排，准确率更高但每次检索多一次模型调用
      enabled: false
      # 留空 = 沿用 embedding 的供应商、base-url 和 api-key
      provider: ""
      base-url: ""
      api-key: ""
      model: ""
    # 检索结果缓存：缓存命中的片段而不是回答，粒度安全
    cache:
      enabled: true
      # memory（进程内，最快）/ redis（多实例共享）/ composite（两级：本地 + Redis）
      store: memory
      capacity: 2000
      ttl-seconds: 300
      redis:
        host: ""
        port: 6379
        password: ""
        key-prefix: "aia:retrieval:"
      # composite 模式下多久比对一次共享版本号（兜底，广播失败时靠它）
      version-check-ms: 2000
      # 订阅 Redis 失效广播，实时清掉本地缓存（把陈旧窗口从秒级压到毫秒级）
      pubsub-enabled: true
    # 同一问题并发时只检索一次
    single-flight-wait-ms: 5000
    chunk-size: 500
    chunk-overlap: 50
    top-k: 5
  # 多轮会话：会话存储 + 答案缓存 + 检索路由 + 上下文压缩
  session:
    enabled: true
    # memory / redis / jdbc / composite（Redis 热存储 + 数据库归档双写）
    store: memory
    ttl-seconds: 604800
    redis:
      host: ""
      port: 6379
      password: ""
      key-prefix: "aia:session:"
  answer-cache:
    # 开启后同一 agent 下归一化相同的问题直接返回缓存答案
    enabled: true
    store: memory
    capacity: 2000
    ttl-seconds: 3600
    redis:
      host: ""
      port: 6379
      password: ""
      key-prefix: "aia:answer:"
  router:
    # 寒暄/空输入不走知识库；canned=固定话术，model=交给模型（不挂知识库工具）
    enabled: true
    chitchat-mode: canned
    chitchat-reply: 您好，我是法律咨询助手，请问有什么可以帮您？
    extra-chitchat: 谢谢,再见,好的
  compression:
    # summarize / model-select / truncate
    enabled: true
    strategy: summarize
    threshold-tokens: 3000
    keep-recent-messages: 8
    model: deepseek-chat
  # 场景路由：接待 agent 收集完信息后，按内容分派给对应专业 agent
  scenarios:
    enabled: true
    # keyword（0 成本）/ embedding（一次向量化）/ llm（一次模型调用）/ cascade（快通道 + 逐级兜底）
    strategy: cascade
    # 快通道门槛：关键词加权得分低于这个值就交给下一级
    min-score: 3
    # 都判不出来时兜底给谁
    default-agent: legal-labor
    llm-model: deepseek-chat
    embedding-min-similarity: 0.62
    rules:
      # 关键词后加 *N 表示权重，具体领域词权重高，压过「辞退」「赔偿」这类泛化词
      - agent: legal-welfare
        keywords: 社保*3,社会保险*3,公积金*3,工伤*3,产假*2,孕期*2,哺乳期*2,年假*2
        description: 社会保险与工伤、女职工三期保护
        examples: 公司没交社保,上班受伤算工伤吗,怀孕了公司想辞退我
      - agent: legal-contract
        keywords: 竞业*3,保密*2,违约金*2,试用期*2,无固定期限*2
        description: 劳动合同与竞业限制：书面合同、试用期、违约金、保密与竞业协议
        examples: 竞业协议有没有效力,一直没签劳动合同,试用期可以约定多久
      - agent: legal-labor
        keywords: 辞退,解雇,开除,欠薪*2,拖欠工资*2,加班费*2,经济补偿,赔偿金,违法解除*2
        description: 劳动争议：辞退解雇、拖欠工资、加班费、经济补偿与赔偿金
        examples: 公司把我辞退了,老板不发工资,加班没有加班费
  # 固定评测集：POST /api/eval/run 触发，衡量检索命中率与答案关键词覆盖
  eval:
    enabled: false
    dataset-dir: evals
    top-k: 5
    # 回归门禁阈值：任一项低于阈值即判定为退化
    thresholds:
      retrieval-hit-rate: 0.95
      keyword-coverage: 0.85
      pass-rate: 0.90

  # 工作流编排：按步骤推进，状态存在会话里，可跨多轮
  # 当前用配置文件承载；后续接数据库时产出同样的 WorkflowDefinition 即可
  workflows:
    # 数据库里的定义优先于本文件；改流程不用重启（默认 10s 内生效）
    load-from-db: true
    db-cache-ttl-ms: 10000
    # 下面是按配置文件定义的工作流（数据库为空时使用）
    items:
      - id: legal-intake-flow
        entry-agent: legal-intake
        # 业务参数：改这里就能调阈值，不用动流程逻辑
        params:
          handoff-threshold: "10000"
        steps:
          - id: collect
            type: collect
            slots: [incident, when, location]
            max-turns: 5
          - id: dispatch
            type: dispatch
          # 大额案件（争议金额超过 1 万）转人工，其余交给专业 agent
          - id: check
            type: condition
            when: slots.amount > params.handoff-threshold
            then: handoff
            otherwise: answer
          - id: handoff
            type: call
            agent: legal-handoff
          - id: answer
            type: call
            agent: "@routed"
