# AI Agent 服务网关示例
# 关键点：流式接口必须关闭代理缓冲，否则 SSE 会被攒着一次性吐出

upstream agentloom_backend {
    # 多实例时把每台都列上，健康检查失败自动摘除
    server 127.0.0.1:8080 max_fails=3 fail_timeout=15s;
    # server 127.0.0.1:8081 max_fails=3 fail_timeout=15s;
    keepalive 32;
}

server {
    listen 80;
    server_name agentloom.example.com;

    # 普通接口
    location /api/ {
        proxy_pass http://agentloom_backend;
        proxy_http_version 1.1;
        proxy_set_header Connection "";
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_read_timeout 120s;
    }

    # 流式接口：必须关缓冲
    location /api/chat/ {
        proxy_pass http://agentloom_backend;
        proxy_http_version 1.1;
        proxy_set_header Connection "";

        proxy_buffering off;           # 关键：否则 SSE 会被攒住
        proxy_cache off;
        chunked_transfer_encoding on;
        gzip off;                      # 压缩会让流式延迟变大

        proxy_read_timeout 300s;       # 长回答要留够时间
        proxy_send_timeout 300s;
    }

    # 健康检查：给负载均衡用，不对外暴露于日志
    location /api/health {
        proxy_pass http://agentloom_backend;
        access_log off;
    }

    # Prometheus 抓取端点：建议只对内网开放
    location /actuator/ {
        allow 10.0.0.0/8;
        allow 172.16.0.0/12;
        allow 192.168.0.0/16;
        deny all;
        proxy_pass http://agentloom_backend;
    }
}
